name: Testes E2E com Cypress

on: [push]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Executar testes E2E no Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
